name: android-aab

on:
  push:
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v3 still defaults `packages` to `tools platform-tools`. Google no longer
      # serves `tools`, and there is no unversioned `cmdline-tools` package
      # either (only ids such as `cmdline-tools;16.0`). This action already
      # unpacks command-line tools from `cmdline-tools-version` (12266719 is
      # 16.0) before it installs `packages`, so ask only for platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode release keystore when secrets exist
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "Release secrets are present. The app bundle will be signed."
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Release secrets are absent. Building a debug app bundle and skipping release signing."
          fi

      - name: Build signed release app bundle
        if: steps.signing.outputs.present == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease --no-daemon \
            -PRELEASE_STORE_FILE="${RUNNER_TEMP}/release.keystore" \
            -PRELEASE_STORE_PASSWORD="${KEYSTORE_PASSWORD}" \
            -PRELEASE_KEY_ALIAS="${KEY_ALIAS}" \
            -PRELEASE_KEY_PASSWORD="${KEY_PASSWORD}"

      - name: Build debug app bundle
        if: steps.signing.outputs.present != 'true'
        working-directory: android
        run: gradle bundleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gridrift-aab
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
