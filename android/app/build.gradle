plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gridrift.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.gridrift.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def store = findProperty('RELEASE_STORE_FILE')
            if (store) {
                storeFile file(store)
                storePassword findProperty('RELEASE_STORE_PASSWORD')
                keyAlias findProperty('RELEASE_KEY_ALIAS')
                keyPassword findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (findProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
