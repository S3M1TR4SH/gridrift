<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141c">
  <title>Gridrift</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="branding/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="branding/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="branding/apple-touch-icon.png">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1 id="title">Gridrift</h1>
      <div class="stats">
        <span>Score <b id="score">0</b></span>
        <span>Streak <b id="streak">0</b></span>
        <span id="round">Round</span>
        <span>Clears <b id="clears">0/0</b></span>
        <span id="combo" hidden></span>
      </div>
      <div class="header-actions">
        <button type="button" id="hint" class="quiet" hidden>Hint</button>
        <button type="button" id="install" class="quiet" hidden>Install</button>
        <button type="button" id="mute" class="quiet" aria-pressed="false">Mute</button>
      </div>
    </header>
    <main>
      <canvas id="board" width="320" height="480" aria-label="Gridrift board"></canvas>
    </main>
  </div>
  <div id="overlay" hidden></div>
  <p id="boot-error" hidden>Gridrift could not start.</p>
  <script type="module" src="src/main.js"></script>
</body>
</html>
